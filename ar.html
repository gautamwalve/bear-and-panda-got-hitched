<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#260506">
<title>Gautam &amp; Tejasvini — Wedding Website AR View</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#260506;color:#fff}
#launch{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;background:radial-gradient(ellipse at 50% 25%,#641417,#260506 72%)}
#launch h1{font:normal clamp(28px,7vw,42px)/1.15 Georgia,serif;color:#f0cf8b;margin:0 0 12px}
#launch p{max-width:360px;color:#f3e4c8;font-size:14px;line-height:1.55;margin:0 0 24px}
button,a{font:600 14px Arial,sans-serif;letter-spacing:.02em;border:1px solid #e0bd78;border-radius:999px;padding:15px 24px;cursor:pointer;text-decoration:none}
#start{background:linear-gradient(135deg,#f4dda9,#c99a4e);color:#351012}
#normal{margin-top:12px;color:#f4dca6;background:transparent}
#status{min-height:20px;margin-top:16px;color:#f5d9a3;font-size:12px;line-height:1.4}
#camera{display:none;position:absolute;inset:0;background:#000}
#feed{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#siteFrame{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,900px);height: min(88svh,1100px);border:2px solid #d9b36d;border-radius:15px;padding:4px;background:linear-gradient(135deg,#f5dda2,#a97636 55%,#e8c77f);box-shadow:0 18px 70px #000b;overflow:hidden}
#site{display:block;width:100%;height:100%;border:0;border-radius:9px;background:#fff}
#controls{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
#controls button{pointer-events:auto;padding:10px 15px;background:#2e0809eF;color:#f8e3b6}
@media(max-height:520px){#siteFrame{height:82svh;width:94vw}}
</style>
</head>
<body>
<main id="launch">
  <h1>Gautam &amp; Tejasvini</h1>
  <p>Open the live wedding website over your camera view.</p>
  <button id="start" type="button">Show my wedding website</button>
  <a id="normal" href="https://gautamwalve.github.io/bear-and-panda-got-hitched/">Open website without camera</a>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<section id="camera" aria-label="Live wedding website over camera view">
  <video id="feed" autoplay muted playsinline></video>
  <div id="controls">
    <button id="close" type="button">Close camera</button>
    <button id="full" type="button">Open full screen page</button>
  </div>
  <div id="siteFrame"><iframe id="site" title="Full live wedding website" allow="autoplay; fullscreen"></iframe></div>
</section>
<script>
(()=>{
 const url='https://gautamwalve.github.io/bear-and-panda-got-hitched/';
 const launch=document.getElementById('launch'),camera=document.getElementById('camera');
 const feed=document.getElementById('feed'),frame=document.getElementById('site');
 const start=document.getElementById('start'),status=document.getElementById('status');
 let stream=null;
 async function stop(){
   if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
   feed.pause();feed.srcObject=null;camera.style.display='none';launch.style.display='flex';
 }
 async function begin(){
   if(!navigator.mediaDevices?.getUserMedia){status.textContent='Camera is unavailable here. Use “Open website without camera”.';return}
   start.disabled=true;status.textContent='Starting camera…';
   try{
     stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
     feed.srcObject=stream;await feed.play();
     frame.src=url;
     launch.style.display='none';camera.style.display='block';
   }catch(e){
     if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
     status.textContent=(e?.name==='NotAllowedError'||e?.name==='SecurityError')
       ?'Camera permission is blocked. Allow camera access for this site in browser settings and try again.'
       :'Could not start camera. You can still open the live website without camera.';
   }finally{start.disabled=false}
 }
 start.addEventListener('click',begin);
 document.getElementById('close').addEventListener('click',stop);
 document.getElementById('full').addEventListener('click',()=>{location.href=url});
 addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
})();
</script>
</body>
</html>
