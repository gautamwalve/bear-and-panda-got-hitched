name: Deploy wedding invitation to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build 3D Dudu and Bubu assets
        run: |
          python -m pip install --disable-pip-version-check trimesh numpy pillow
          python scripts/create_3d_mascots.py
          python - <<'PY'
          from PIL import Image
          for name in ("banner-bride-20261030", "banner-groom-20261030"):
              with Image.open(f"{name}.webp") as source:
                  source.convert("RGBA").save(f"{name}.png", "PNG", optimize=True)
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
