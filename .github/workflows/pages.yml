name: Deploy wedding invitation to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble site (only the files the page uses)
        run: |
          python -m pip install --disable-pip-version-check pillow
          mkdir _site
          cp index.html favicon.svg floral-spray.svg flower-only-field.svg _site/
          cp bride-cutout-final.webp groom-cutout.webp _site/
          cp "Tumhi Dekho Naa (Sitar Lofi).mp3" "Chand Tu Nabhatla.mp3" _site/
          python - <<'PY'
          from PIL import Image
          for name in ("banner-bride-20261030", "banner-groom-20261030"):
              with Image.open(f"{name}.webp") as source:
                  source.convert("RGBA").save(f"_site/{name}.png", "PNG", optimize=True)
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
